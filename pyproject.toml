[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "visual-ad-lab"
version = "0.1.0"
description = "Reproducible MVTec method comparison and CPU inspection demo"
requires-python = ">=3.11,<3.13"
dependencies = [
  "numpy>=2,<3", "pillow>=11,<13", "pydantic>=2.10,<3", "pyyaml>=6,<7",
]

[project.optional-dependencies]
evaluation = ["scipy>=1.13,<2", "scikit-learn>=1.5,<2"]
dev = ["pytest>=8,<9", "ruff>=0.11,<1", "build>=1.2,<2", "hatchling>=1.27,<2", "nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6,<7"]

[project.scripts]
vad = "visual_ad.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/visual_ad"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
